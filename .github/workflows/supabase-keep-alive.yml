name: Supabase keep-alive

on:
  schedule:
    # 02:00 UTC daily (09:00 Bangkok). Free projects pause after 7 idle days.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/keep-alive.mjs
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
